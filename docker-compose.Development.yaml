services:
  web:
    environment:
      ASPNETCORE_URLS: 'http://+:5000'
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: 'Data Source=/data/cynosura.db'
      Messaging__ConnectionUrl: 'rabbitmq://mq'
      Messaging__Username: 'Manager'
      Messaging__Password: 'Qwerty123!'
      Cors__Origin: 'http://localhost:5010'
      IdentityServer__Clients__Cynosura.Studio.Web.Ng__RedirectUri: 'http://localhost:5010/authentication/login-callback'
      IdentityServer__Clients__Cynosura.Studio.Web.Ng__LogoutUri: 'http://localhost:5010/authentication/logout-callback'
      Jwt__CertificatePath: '/my/cert/mycert.pfx'
      Jwt__CertificatePassword: 'qwe123'
      FileSystemStorage__Path: 'wwwroot/static'
      FileSystemStorage__Url: 'http://localhost:5000/static'
    ports:
      - '0.0.0.0:5000:5000'
    volumes:
      - data:/data
      - static:/app/wwwroot/static
      - ./volumes/cert:/my/cert:ro
  webng:
    ports:
      - '0.0.0.0:5010:80'
    volumes:
      - ./volumes/webng/config.json:/usr/share/nginx/html/assets/config.json
  worker:
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: 'Data Source=/data/cynosura.db'
      Messaging__ConnectionUrl: 'rabbitmq://mq'
      Messaging__Username: 'Manager'
      Messaging__Password: 'Qwerty123!'
      FileSystemStorage__Path: '/app/wwwroot/static'
      FileSystemStorage__Url: 'http://localhost:5000/static'
    volumes:
      - data:/data
      - static:/app/wwwroot/static
  mq:
    environment:
      RABBITMQ_DEFAULT_USER: 'Manager'
      RABBITMQ_DEFAULT_PASS: 'Qwerty123!'
    ports:
      - '0.0.0.0:5672:5672'
      - '0.0.0.0:15672:15672'
    volumes:
      - mq:/var/lib/rabbitmq
volumes:
  data:
  static:
  mq:
